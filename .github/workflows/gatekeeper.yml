# GateKeeper 门禁 CI —— 把「六道门禁 + 单一事实源漂移」从 web 一个端扩到 CI 端
# 说明：独立 repo 直接生效；在共享大仓内不触发，属设计交付物，用于演示「同一引擎进 CI、PR 自动跑验收」。
name: gatekeeper-gates

on:
  push:
    paths: ['prototype/**', '.github/workflows/gatekeeper.yml']
  pull_request:
    paths: ['prototype/**', '.github/workflows/gatekeeper.yml']
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # 只读令牌：本 workflow 无发布/评论动作
    defaults:
      run:
        working-directory: prototype
    steps:
      # pin 到完整 SHA（v4.2.2 / v4.4.0，git ls-remote 实测）：可变 tag 被劫持时 CI 不至执行非预期代码
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: 单一事实源漂移门禁（引擎块 == gates.mjs）
        run: node sync-gates.mjs --check
      - name: 配置/数据漂移门禁（注入块 == configs/）
        run: node sync-configs.mjs --check
      - name: 渲染纯函数漂移门禁（注入块 == render-core.mjs）
        run: node sync-render.mjs --check
      - name: 功能回归红线 + 换配置差异
        run: node verify.mjs
      - name: 引擎单元/负样本测试（node:test）
        run: node --test gates.test.mjs
      - name: 渲染纯函数测试（node:test）
        run: node --test render-core.test.mjs
      - name: 核心治理文档体检（全部核心文档，任一非「可发布」exit 1）
        run: node check-docs.mjs
      - name: 文档口径体检（代码真值 → 文档当前态声明，任一漂移 exit 1）
        run: node tools/doc-sync.mjs
      - name: 全仓链接体检（站内链接存在性，越仓/断链 exit 1）
        run: node tools/lint-links.mjs
      - name: 工作区体检（垃圾文件/STRUCTURE 树声明/gitignore 覆盖，exit 1）
        run: node tools/lint-workspace.mjs
      - name: class/id 集合对拍（基线 ⊆ 实测，只增不删，exit 1）
        run: node tools/class-audit.mjs
      # 注：布局结果判据 tools/lint-layout.mjs 需真实浏览器（playwright + chromium），
      #     故只在本地门序列 prototype/tools/gate.mjs 中执行，不进本 CI（避免每次 CI 额外下载浏览器）。
      # informational：换配置能力演示（xiyouji 口径代跑根文档），失败不作红线——红线在 verify/check-docs
      - name: 换配置体检演示（informational）
        run: node project-check.mjs --config configs/xiyouji.json ../README.md ../DESIGN.md ../CHANGELOG.md --compare || true
      - name: 汇总验收状态
        if: always()
        run: |
          echo "## GateKeeper · CI 门禁" >> "$GITHUB_STEP_SUMMARY"
          echo "- 漂移双门禁 + 回归红线 + 文档体检 全部通过则本 job 绿" >> "$GITHUB_STEP_SUMMARY"
          echo "- 规则源 gates.mjs / 配置源 configs/*.json 单一事实源，前端不硬编码" >> "$GITHUB_STEP_SUMMARY"
