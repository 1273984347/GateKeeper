# GateKeeper 门禁 CI —— 把「六道门禁 + 单一事实源漂移」从 web 一个端扩到 CI 端
# 说明：独立 repo 直接生效；在共享大仓内不触发，属设计交付物，用于演示「同一引擎进 CI、PR 自动跑验收」。
name: gatekeeper-gates

on:
  push:
    paths: ['prototype/**', 'docs/**', '*.md', '.github/workflows/gatekeeper.yml']
  pull_request:
    paths: ['prototype/**', 'docs/**', '*.md', '.github/workflows/gatekeeper.yml']
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # 只读令牌：本 workflow 无发布/评论动作
    defaults:
      run:
        working-directory: prototype
    steps:
      # pin 到完整 SHA（v4.2.2 / v4.4.0，git ls-remote 实测）：可变 tag 被劫持时 CI 不至执行非预期代码
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      # 单一清单源（v0.21.5）：CI 只跑 gate.mjs --ci（剔除浏览器门 lint-layout/smoke），
      # 门清单以 tools/gate.mjs 源内数组为唯一权威——本地十三门与 CI 十二门永不漂移。
      # 注：布局结果判据 tools/lint-layout.mjs 需真实浏览器（playwright + chromium），只在本地门序列执行。
      - name: 全量门禁（非浏览器门，单一清单源 gate.mjs --ci）
        run: node tools/gate.mjs --ci
      # informational：换配置能力演示（xiyouji 口径代跑根文档），失败不作红线——红线在 verify/check-docs
      - name: 换配置体检演示（informational）
        run: node project-check.mjs --config configs/xiyouji.json ../README.md ../DESIGN.md ../CHANGELOG.md --compare || true
      - name: 汇总验收状态
        if: always()
        run: |
          echo "## GateKeeper · CI 门禁" >> "$GITHUB_STEP_SUMMARY"
          echo "- gate.mjs --ci 单一清单源：漂移三检 + 回归红线 + 单测 + 语法 + 文档/口径/链接/工作区/class/UI 门全过则本 job 绿" >> "$GITHUB_STEP_SUMMARY"
          echo "- 规则源 gates.mjs / 配置源 configs/*.json 单一事实源，前端不硬编码" >> "$GITHUB_STEP_SUMMARY"
